<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Ziarah Pamijahan</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1f2a24;--mut:#66726b;--ac:#1f6b4a;--bd:#d9ddd5;--er:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2621;--tx:#e8eee9;--mut:#9aa8a0;--ac:#4cb988;--bd:#33403a}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.6}
.msg{margin-top:12px;font-weight:600}
.row{display:flex;gap:8px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd);white-space:nowrap}
a{color:var(--ac)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Pendaftaran Ziarah Pamijahan</h1>
  <p class="sub">Wisata religi Makam Pamijahan &amp; Pantai Sindangkerta</p>

  <!-- HALAMAN PENDAFTARAN (publik) -->
  <section id="vDaftar">
    <div class="card">
      <label for="nama">Nama peserta</label>
      <input id="nama" autocomplete="name">
      <label for="alamat">Alamat</label>
      <textarea id="alamat" rows="2" autocomplete="street-address"></textarea>
      <label for="hp">No. Handphone</label>
      <input id="hp" type="tel" inputmode="tel" autocomplete="tel">
      <label for="tgl">Tanggal daftar</label>
      <input id="tgl" readonly>
      <button id="kirim">Daftar</button>
      <div class="msg" id="msgD"></div>
    </div>
    <p class="sub"><a href="#admin">Login admin</a></p>
  </section>

  <!-- LOGIN ADMIN -->
  <section id="vLogin" hidden>
    <div class="card">
      <strong>Login Admin</strong>
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="masuk">Masuk</button>
      <div class="msg" id="msgL"></div>
    </div>
    <p class="sub"><a href="#">Kembali ke pendaftaran</a></p>
  </section>

  <!-- DASHBOARD ADMIN -->
  <section id="vAdmin" hidden>
    <div class="card">
      <strong id="total">Memuat…</strong>
      <input id="cari" placeholder="Cari nama / alamat / no. HP" style="margin-top:10px">
      <div class="row">
        <button class="sec" id="csv">Unduh CSV</button>
        <button class="sec" id="keluar">Keluar</button>
      </div>
      <div class="msg" id="msgA"></div>
    </div>
    <div class="card wrap">
      <table><thead><tr><th>#</th><th>Nama</th><th>Alamat</th><th>No. HP</th><th>Tgl Daftar</th><th></th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ====== ISI DUA BARIS INI (dari Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://ajpmdyoichanpxtyfmyw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HZashMJi3bnz9CWTb5GcOQ_13jaVWhM";
// ========================================================================
const KAPASITAS = 59;
const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let data = [];

const tglHariIni = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
$('tgl').value = tglHariIni;
const say = (el,t,err)=>{el.textContent=t;el.style.color=err?'var(--er)':'var(--ac)'};

async function route(){
  const admin = location.hash === '#admin';
  const { data:{ session } } = await sb.auth.getSession();
  $('vDaftar').hidden = admin;
  $('vLogin').hidden = !(admin && !session);
  $('vAdmin').hidden = !(admin && session);
  if(admin && session) muat();
}
window.addEventListener('hashchange', route);

$('kirim').onclick = async () => {
  const nama=$('nama').value.trim(), alamat=$('alamat').value.trim(), hp=$('hp').value.trim();
  if(!nama||!alamat||!hp) return say($('msgD'),'Nama, alamat, dan no. handphone wajib diisi.',true);
  if(!/^[0-9+\-\s]{8,16}$/.test(hp)) return say($('msgD'),'Format no. handphone belum benar.',true);
  $('kirim').disabled = true;
  const { error } = await sb.from('peserta').insert({ nama, alamat, hp });
  if(error){ $('kirim').disabled=false; return say($('msgD'),'Gagal mendaftar, coba lagi.',true); }
  say($('msgD'),'Alhamdulillah, pendaftaran tercatat. Silakan tunggu info lanjutan dari panitia.');
  ['nama','alamat','hp'].forEach(i=>$(i).value='');
  setTimeout(()=>{$('kirim').disabled=false},3000);
};

$('masuk').onclick = async () => {
  $('masuk').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email:$('em').value.trim(), password:$('pw').value });
  $('masuk').disabled = false;
  if(error) return say($('msgL'),'Email atau password salah.',true);
  $('pw').value=''; route();
};
$('keluar').onclick = async () => { await sb.auth.signOut(); location.hash=''; route(); };

async function muat(){
  const { data:rows, error } = await sb.from('peserta').select('*').order('created_at');
  if(error) return say($('msgA'),'Gagal memuat data.',true);
  data = rows; tampil();
}
function tampil(){
  const q = $('cari').value.toLowerCase();
  const tb = $('rows'); tb.textContent='';
  data.forEach((r,i)=>{
    if(q && !(r.nama+r.alamat+r.hp).toLowerCase().includes(q)) return;
    const tr = document.createElement('tr');
    [i+1,r.nama,r.alamat,r.hp,r.tanggal_daftar].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});
    const td = document.createElement('td'), b = document.createElement('button');
    b.textContent='Hapus'; b.className='sec'; b.style.cssText='margin:0;width:auto;padding:4px 10px';
    b.onclick = async () => { if(!confirm('Hapus '+r.nama+'?')) return; await sb.from('peserta').delete().eq('id',r.id); muat(); };
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
  $('total').textContent = data.length+' pendaftar dari '+KAPASITAS+' seat';
}
$('cari').oninput = tampil;
$('csv').onclick = () => {
  const esc = v => '"'+String(v).replace(/"/g,'""')+'"';
  const csv = ['No,Nama,Alamat,No. HP,Tanggal Daftar'].concat(data.map((r,i)=>[i+1,r.nama,r.alamat,r.hp,r.tanggal_daftar].map(esc).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download = 'peserta-ziarah-pamijahan.csv'; a.click();
};
route();
</script>
</body>
</html>
